# GT2 Algorithm Configuration
# Game-Theoretic Topology Control with two-stage games:
#   Game 1: Mixed-strategy clustering game (CH election)
#   Game 2: Pure-strategy power-control game (intra-cluster topology)

# ── Clustering Game (Game 1) ─────────────────────────────────────────
payoff: 1.0e-3            # rho: benefit/payoff for being a cluster head

# ── Power-Control Game (Game 2) ──────────────────────────────────────
alpha: 1.5                # weight for energy-balance benefit f_e
beta: 0.1                 # weight for connectivity benefit f_pr
mu: 0.01                  # scaling factor for integral energy-cost c_i
