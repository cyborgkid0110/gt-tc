# SCA-Lévy Clustering Routing Algorithm Configuration
# Reference: Guo et al., IEEE Access, 11, 22654–22663 (2023).

# ── CH election (SCA with improved step + Lévy mutation) ──────────────
population_size: 30           # m: number of candidate CH groupings
max_sca_iter: 50              # T: SCA iterations per round
sca_a: 2.0                    # r1 amplitude — r1 = a*sin(pi/2*(1 - t/T)) + b
sca_b: 0.5                    # r1 offset; keeps r1 ∈ [0.5, 2.5]
levy_beta: 1.5                # Mantegna stability parameter β

# ── Cluster sizing ────────────────────────────────────────────────────
p_ch_fraction: 0.05           # p: target CH fraction (~10 CHs for 200 nodes)
high_energy_fraction: 0.5     # candidate pool = top 50% alive nodes by residual energy

# ── Simulation ────────────────────────────────────────────────────────
max_rounds: 50000
plot_period: 1000
