# TCLE Algorithm Configuration
# Topology Control with Lifetime Extension
# Reference: Xu et al., IEEE Trans. Vehicular Technology, 2016.

# ── Algebraic Connectivity ───────────────────────────────────────────
epsilon: 0.01             # threshold: benefit = 1 if λ₂ > ε, else 0

# ── Unwillingness / Pricing Function ────────────────────────────────
pricing: 'quadratic'      # 'linear' (f=x), 'quadratic' (f=x²), or 'exponential' (f=exp(x/10))
mu: 0.01                  # normalisation constant M_i

# ── Block Partition & Event-Triggered Reconstruction ────────────────
kappa_levels: 10          # K: number of unwillingness levels; also governs max block size

# ── Wait Time Priority ──────────────────────────────────────────────
tau: 1.0                  # time constant: t_w = τ * E_i + σ
sigma_max: 0.1            # max random perturbation for tie-breaking

# ── Simulation ───────────────────────────────────────────────────────
max_rounds: 50000
plot_period: 1000
